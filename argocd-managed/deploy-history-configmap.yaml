# -----------------------------------------------------------------------------
# CI/CD 탭의 "배포 히스토리" 타임라인용 데이터 저장소.
#
# 쓰기: Jenkinsfile의 Verify Deployment 스테이지가 배포 성공/롤백 시마다 이 파일을
#       ChaosArena-manifests 레포에서 직접 고쳐 commit+push한다 (앱은 절대 안 씀).
# 반영: ArgoCD가 deployment.yaml과 똑같이 이 파일도 감지해서 클러스터에 동기화한다.
# 읽기: app.py가 chaos-dashboard-sa ServiceAccount(k8s/rbac.yaml, configmaps get 권한)로
#       읽어서 /api/deploy-history로 내려준다.
#
# history.jsonl은 JSON 배열이 아니라 JSON Lines(줄 하나 = 이벤트 하나, 최신이 맨 위)다.
# 배열로 저장하면 매번 파싱→앞에 추가→재직렬화가 필요한데, Jenkins의 git 컨테이너엔 jq가
# 없어서 배열 조작이 번거롭다. JSON Lines는 "새 줄을 맨 앞에 붙이고 head -n 10으로 자르기"만
# 하면 되므로 yq/head/echo만으로 충분하다 (docs/CONCEPTS.md 참고).
# -----------------------------------------------------------------------------

apiVersion: v1
kind: ConfigMap
metadata:
  name: chaos-deploy-history
  namespace: default
data:
  history.jsonl: "{\"build_number\":\"32\",\"git_commit\":\"1c12dfc\",\"status\":\"rollback\",\"recovered_build\":\"31\",\"timestamp\":\"2026-07-28T10:37:52Z\"}\n{\"build_number\":\"31\",\"git_commit\":\"16ab9fa\",\"status\":\"success\",\"timestamp\":\"2026-07-28T10:33:51Z\"}\n{\"build_number\":\"30\",\"git_commit\":\"62c07af\",\"status\":\"success\",\"timestamp\":\"2026-07-28T10:24:58Z\"}\n{\"build_number\":\"29\",\"git_commit\":\"25f71f5\",\"status\":\"rollback\",\"recovered_build\":\"28\",\"timestamp\":\"2026-07-28T10:19:59Z\"}\n{\"build_number\":\"28\",\"git_commit\":\"ccd239d\",\"status\":\"success\",\"timestamp\":\"2026-07-28T10:15:09Z\"}\n{\"build_number\":\"27\",\"git_commit\":\"8894894\",\"status\":\"rollback\",\"recovered_build\":\"26\",\"timestamp\":\"2026-07-28T10:00:04Z\"}\n{\"build_number\":\"26\",\"git_commit\":\"66c61b6\",\"status\":\"success\",\"timestamp\":\"2026-07-28T09:54:35Z\"}\n{\"build_number\":\"25\",\"git_commit\":\"1b5bb8d\",\"status\":\"success\",\"timestamp\":\"2026-07-28T09:36:33Z\"}"
