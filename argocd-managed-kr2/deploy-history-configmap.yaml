# -----------------------------------------------------------------------------
# CI/CD 탭의 "배포 히스토리" 타임라인용 데이터 저장소.
#
# 쓰기: Jenkinsfile의 Verify Deployment 스테이지가 배포 성공/롤백 시마다 이 파일을
#       ChaosArena-manifests 레포에서 직접 고쳐 commit+push한다 (앱은 절대 안 씀).
# 반영: ArgoCD가 deployment.yaml과 똑같이 이 파일도 감지해서 클러스터에 동기화한다.
# 읽기: app.py가 chaos-dashboard-sa ServiceAccount(k8s/rbac.yaml, configmaps get 권한)로
#       읽어서 /api/deploy-history로 내려준다.
#
# history.jsonl은 JSON 배열이 아니라 JSON Lines(줄 하나 = 이벤트 하나, 최신이 맨 위)다.
# 배열로 저장하면 매번 파싱→앞에 추가→재직렬화가 필요한데, Jenkins의 git 컨테이너엔 jq가
# 없어서 배열 조작이 번거롭다. JSON Lines는 "새 줄을 맨 앞에 붙이고 head -n 10으로 자르기"만
# 하면 되므로 yq/head/echo만으로 충분하다 (docs/CONCEPTS.md 참고).
# -----------------------------------------------------------------------------

apiVersion: v1
kind: ConfigMap
metadata:
  name: chaos-deploy-history
  namespace: default
data:
  history.jsonl: "{\"build_number\":\"69\",\"git_commit\":\"4259583\",\"status\":\"success\",\"timestamp\":\"2026-08-04T00:48:00Z\"}\n{\"build_number\":\"68\",\"git_commit\":\"1f017df\",\"status\":\"success\",\"timestamp\":\"2026-07-31T08:16:08Z\"}\n{\"build_number\":\"67\",\"git_commit\":\"c981e22\",\"status\":\"success\",\"timestamp\":\"2026-07-31T08:03:44Z\"}\n{\"build_number\":\"66\",\"git_commit\":\"9af31a2\",\"status\":\"success\",\"timestamp\":\"2026-07-31T07:51:49Z\"}\n{\"build_number\":\"65\",\"git_commit\":\"ccb2ce4\",\"status\":\"success\",\"timestamp\":\"2026-07-31T07:39:02Z\"}\n{\"build_number\":\"64\",\"git_commit\":\"1931500\",\"status\":\"success\",\"timestamp\":\"2026-07-31T06:40:42Z\"}\n{\"build_number\":\"63\",\"git_commit\":\"4c9c850\",\"status\":\"success\",\"timestamp\":\"2026-07-31T06:29:56Z\"}\n{\"build_number\":\"62\",\"git_commit\":\"1357f7e\",\"status\":\"success\",\"timestamp\":\"2026-07-31T05:34:24Z\"}\n{\"build_number\":\"61\",\"git_commit\":\"9fbf042\",\"status\":\"success\",\"timestamp\":\"2026-07-31T05:13:36Z\"}\n{\"build_number\":\"59\",\"git_commit\":\"c01e4b8\",\"status\":\"success\",\"timestamp\":\"2026-07-31T04:56:45Z\"}"
